<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#0D111A" rx="40"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="mGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A3E635;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#84CC16;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- M Letter -->
  <text x="100" y="145" font-family="Inter, Arial, sans-serif" font-size="120" font-weight="700" text-anchor="middle" fill="url(#mGradient)" letter-spacing="-5">M</text>
</svg>
