<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | Monu Kumar Pathak</title>
  <meta name="description" content="Applied AI, optimization, simulation, and reinforcement learning projects by Monu Kumar Pathak" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .projects-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 80px 0;
    }

    .project-wheel-container {
      position: relative;
      width: 100%;
      height: 600px;
      max-width: 1200px;
      margin: 0 auto;
      perspective: 1200px;
    }

    .project-wheel {
      position: absolute;
      width: 100%;
      height: 100%;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      transform-style: preserve-3d;
    }

    .project-item {
      position: absolute;
      width: 420px;
      left: 50%;
      top: 50%;
      transform-origin: center center;
      transform: translateX(-50%) translateY(-50%) rotateX(0deg) translateZ(0);
      transition: opacity 0.3s ease;
      opacity: 0.4;
    }

    .project-item.active {
      opacity: 1;
      z-index: 10;
    }

    .project-item.prev {
      opacity: 0.6;
      z-index: 5;
    }

    .project-item.next {
      opacity: 0.6;
      z-index: 5;
    }

    .project-card {
      padding: 32px;
      border-radius: 16px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      height: 100%;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .project-card h3 {
      margin: 0 0 12px;
      font-size: 1.3rem;
      color: #f1f7fb;
    }

    .project-card p {
      color: var(--muted);
      line-height: 1.6;
      flex: 1;
      margin: 0 0 16px;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
    }

    .tag-badge {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(118, 185, 0, 0.1);
      border: 1px solid var(--accent);
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--accent-2);
      font-weight: 600;
    }

    .projects-info {
      position: absolute;
      bottom: 40px;
      left: 40px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .scroll-indicator {
      position: absolute;
      bottom: 20px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-2);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .scroll-indicator svg {
      width: 16px;
      height: 16px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .project-wheel-container {
        height: 500px;
      }

      .project-item {
        width: 300px;
      }

      .project-card {
        padding: 24px;
      }

      .project-card h3 {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="neural-canvas" aria-hidden="true"></canvas>

  <header class="site-header glass">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">Monu<span>.AI</span></a>
      <nav>
        <a href="index.html#about">About</a>
        <a href="index.html#trajectory">Trajectory</a>
        <a href="projects.html">Projects</a>
        <a href="index.html#endorsements">Endorsements</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="projects-section">
    <div class="container">
      <h2 class="reveal" style="text-align: center; margin-bottom: 60px;">Selected Projects</h2>
      
      <div class="project-wheel-container">
        <div class="project-wheel" id="project-wheel">
          <!-- Projects will be inserted here by JavaScript -->
        </div>
      </div>

      <div class="projects-info">
        <p><strong>Scroll</strong> through the carousel to explore projects</p>
      </div>

      <div class="scroll-indicator">
        <span>Scroll to explore</span>
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 5v14M19 12l-7 7-7-7"></path>
        </svg>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; Monu Kumar Pathak . Applied AI and Algorithms Portfolio</p>
  </footer>

  <script src="script.js"></script>
  <script>
    // Project wheel carousel
    const projects = [
      {
        title: 'Agentic Supply-Chain Decision Intelligence',
        description: 'Built a stateful LangGraph decision layer with human approval for data writes, achieving 96% grounded structured output and reducing numeric hallucination from 18% to 2%.',
        tags: ['LangGraph', 'Agentic AI', 'Supply Chain']
      },
      {
        title: 'Sample-Efficient Inventory Policy Learning',
        description: 'Built HDPO and graph neural network inventory policies in PyTorch, reaching optimality gaps as low as 0.03% with up to 64x less data.',
        tags: ['PyTorch', 'GNN', 'Differentiable Simulation']
      },
      {
        title: 'Deep RL for Production Scheduling',
        description: 'Implemented a DQN agent from scratch in a SimPy discrete-event environment, reducing makespan by 42% against conventional dispatching rules.',
        tags: ['Deep RL', 'Decision AI', 'SimPy']
      },
      {
        title: 'XAI for Simulation Output Analysis',
        description: 'Ran more than one million simulations and combined K-Means, DBSCAN, neural networks, random forests, and SHAP to explain output behavior.',
        tags: ['Simulation', 'XAI', 'SHAP']
      },
      {
        title: 'Differentially Private Recommendation Systems',
        description: 'Applied Laplace noise at input, processing, and output stages and implemented ALS and SGD matrix factorization, achieving 0.92 RMSE on perturbed data.',
        tags: ['ML Systems', 'Differential Privacy', 'Recommenders']
      },
      {
        title: 'Commonsense Reasoning in LLMs',
        description: 'Fine-tuned GPT-1 using ConceptNet and ATOMIC, achieving 11.14 perplexity and a 15.10 BLEU-2 score for commonsense inference generation.',
        tags: ['GPT-1', 'Knowledge Graphs', 'NLP']
      },
      {
        title: 'Multi-Echelon Inventory Network Modeling',
        description: 'Modeled stochastic demand and lead-time propagation, service-level reorder points, expected backorders, and bill-of-material dependencies across inventory networks.',
        tags: ['Stochastic Modeling', 'Inventory', 'Graph Algorithms']
      },
      {
        title: 'Derivative-Free Inventory Optimization',
        description: 'Solved a stochastic nonlinear inventory model using Dual Annealing and Differential Evolution, with warm starts and variable elimination for faster convergence.',
        tags: ['Nonlinear Optimization', 'SciPy', 'Metaheuristics']
      },
      {
        title: 'Statistical Distribution Modeling',
        description: 'Developed and validated parametric convolution approximations using AIC, BIC, the KS statistic, and PP and QQ diagnostic plots.',
        tags: ['Probability', 'AIC/BIC', 'Goodness of Fit']
      },
      {
        title: 'Open-Source FJSSP Simulation Library',
        description: 'Created a configurable SimPy library for flexible job-shop scheduling with pluggable rules, live-state access, and pause, test, and resume workflows.',
        tags: ['Open Source', 'SimPy', 'Scheduling']
      },
      {
        title: 'EHR-Based Patient Risk Modeling',
        description: 'Modeled 58,000 hospital admissions with LSTM, Transformers, and LightGBM, improving disease-classification AUROC by 19% over end-to-end neural models.',
        tags: ['Healthcare AI', 'EHR', 'Transformers']
      },
      {
        title: 'Insurance Risk Quantification',
        description: 'Identified insurance claim distributions with KS and chi-squared tests, quantified tail risk using VaR and TVaR, and proposed risk-based product strategies.',
        tags: ['Risk Modeling', 'VaR/TVaR', 'Statistical Testing']
      }
    ];

    function setupProjectWheel() {
      const wheel = document.getElementById('project-wheel');
      const wheelContainer = document.querySelector('.project-wheel-container');
      
      // Create project items
      projects.forEach((project, index) => {
        const angle = (index / projects.length) * 360;
        const item = document.createElement('div');
        item.className = 'project-item';
        item.dataset.index = index;
        
        item.innerHTML = `
          <div class="project-card">
            <h3>${project.title}</h3>
            <p>${project.description}</p>
            <div class="project-tags">
              ${project.tags.map(tag => `<span class="tag-badge">${tag}</span>`).join('')}
            </div>
          </div>
        `;
        
        wheel.appendChild(item);
      });

      const items = document.querySelectorAll('.project-item');
      let currentIndex = 0;
      let scrollTimeout;

      function updateWheel() {
        const radius = 280;
        items.forEach((item, index) => {
          let relativeIndex = (index - currentIndex + projects.length) % projects.length;
          
          // Convert to angle relative to top
          const angle = (relativeIndex - 1) * (180 / (projects.length - 1));
          
          // Calculate position on half circle (right side)
          const x = Math.sin((angle * Math.PI) / 180) * radius;
          const y = Math.cos((angle * Math.PI) / 180) * radius;
          const z = Math.cos((angle * Math.PI) / 180) * 100;
          
          // Update classes
          item.classList.remove('active', 'prev', 'next');
          if (relativeIndex === 1) {
            item.classList.add('active');
          } else if (relativeIndex === 0) {
            item.classList.add('prev');
          } else if (relativeIndex === 2) {
            item.classList.add('next');
          }
          
          // Apply transform
          item.style.transform = `translate(${x}px, ${y}px) scale(${0.8 + z / 500})`;
          item.style.zIndex = Math.round(z + 100);
        });
      }

      // Initial update
      updateWheel();

      // Scroll handler
      let lastScrollTime = 0;
      window.addEventListener('wheel', (e) => {
        const now = Date.now();
        if (now - lastScrollTime < 100) return;
        
        if (e.deltaY > 0) {
          currentIndex = (currentIndex + 1) % projects.length;
        } else {
          currentIndex = (currentIndex - 1 + projects.length) % projects.length;
        }
        
        lastScrollTime = now;
        updateWheel();
        e.preventDefault();
      }, { passive: false });

      // Touch support
      let touchStartY = 0;
      wheelContainer.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
      });

      wheelContainer.addEventListener('touchmove', (e) => {
        const touchEndY = e.touches[0].clientY;
        const diff = touchStartY - touchEndY;

        if (Math.abs(diff) > 50) {
          if (diff > 0) {
            currentIndex = (currentIndex + 1) % projects.length;
          } else {
            currentIndex = (currentIndex - 1 + projects.length) % projects.length;
          }
          touchStartY = touchEndY;
          updateWheel();
        }
      });
    }

    // Initialize when page loads
    document.addEventListener('DOMContentLoaded', setupProjectWheel);
  </script>
</body>
</html>
